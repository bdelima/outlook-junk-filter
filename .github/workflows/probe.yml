name: Probe
on:
  push:
    branches: ["safelinks-probe"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker pull bdelima/outlook-junk-filter:0.4.0
      - run: sh probe/probe.sh bdelima/outlook-junk-filter:0.4.0
