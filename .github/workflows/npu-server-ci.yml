name: ovms-npu CI

# The second image in this repo (npu-server/): build it and run its image tests. Runs only when that image,
# the shared license files or these workflows change. CI runners have no NPU, so the tests check the image
# contents (driver library, versions, user, licenses), not inference.

on:
  pull_request:
    paths:
      - "npu-server/**"
      - LICENSE
      - ATTRIBUTION.md
      - ".github/workflows/npu-server-*.yml"
  push:
    branches: ["**"]
    paths:
      - "npu-server/**"
      - LICENSE
      - ATTRIBUTION.md
      - ".github/workflows/npu-server-*.yml"

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build
        run: docker build -f npu-server/Dockerfile --build-arg VERSION="$(tr -d '[:space:]' < npu-server/VERSION)" --build-arg REVISION="$GITHUB_SHA" -t ovms-npu-test .

      - name: Image tests
        run: npu-server/test.sh ovms-npu-test
