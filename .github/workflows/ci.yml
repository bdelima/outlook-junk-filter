name: CI

# Pull requests and branch pushes: lint and unit tests, then a docker build (not pushed)
# and the image tests. Nothing here needs a secret, a network service or real mail.

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the image (not pushed)
        run: |
          docker build \
            --build-arg VERSION="$(tr -d '[:space:]' < VERSION)" \
            --build-arg REVISION="${GITHUB_SHA}" \
            -t ojf-test .

      - name: Image tests
        run: tests/image/test-image.sh ojf-test

      - name: Licenses of the packages in the image (for ATTRIBUTION.md review)
        run: |
          docker run --rm --entrypoint sh ojf-test -c '
            for pkg in spamassassin libnet-dns-perl libmail-spf-perl libmail-dkim-perl libio-socket-ssl-perl gnupg ca-certificates; do
              echo "== $pkg"
              grep -hE "^(License|Copyright):" /usr/share/doc/$pkg/copyright 2>/dev/null | sort | uniq -c | sort -rn | head -6
            done
            echo "== python"; python --version; python -c "import sys; print(sys.version)"
            cat /etc/debian_version
          '

      - name: TEMP diagnose spamassassin config dirs
        if: always()
        run: |
          mkdir -p /tmp/cfg && cp config/local.cf.example /tmp/cfg/local.cf && chmod -R a+rX /tmp/cfg
          docker run --rm --user 1000:1000 -v /tmp/cfg:/config:ro --entrypoint sh ojf-test -c '
            spamassassin -V
            echo "== etc"; ls -la /etc/spamassassin
            echo "== share"; ls /usr/share/spamassassin | head -30
            echo "== var"; ls -R /var/lib/spamassassin | head -20
            echo "== debug"; HOME=/tmp spamassassin -D config,plugin --lint --siteconfigpath /config 2>&1 | head -60
          '
