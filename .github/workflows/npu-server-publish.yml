name: Release and publish ovms-npu

# Bump npu-server/VERSION in a reviewed PR and merge it: this creates a GitHub Release tagged
# `ovms-npu-<version>` and an amd64 image bdelima/ovms-npu:<version> (+ latest) on Docker Hub.
#
# Same gate as the main image: the job runs in the `release` Environment, which requires a human approval and holds
# the Docker Hub secrets, so a merge alone can never publish. The Docker Hub token must be able to write to
# bdelima/ovms-npu (a token scoped to one image needs this repository added, or a second token).

on:
  push:
    branches: [main]
    paths:
      - npu-server/VERSION

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version
        id: version
        run: |
          v="$(tr -d '[:space:]' < npu-server/VERSION)"
          if [ -z "$v" ]; then
            echo "npu-server/VERSION is empty" >&2
            exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "tag=ovms-npu-$v" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.check.outputs.exists == 'false'

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.check.outputs.exists == 'false'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.check.outputs.exists == 'false'
        with:
          context: .
          file: npu-server/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
          tags: |
            bdelima/ovms-npu:${{ steps.version.outputs.value }}
            bdelima/ovms-npu:latest

      - name: Create tag and GitHub Release
        # Created LAST, after the image is pushed, so a failed build never leaves a release with no image.
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "ovms-npu ${{ steps.version.outputs.value }}" \
            --generate-notes
